{% extends "base.html" %}

{% block title %}Party Budget Planner - PocketSmart AI{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">
  <h1 style="margin-bottom: 0.5rem;">Party & Event Budget Planner</h1>
  <p style="color: #94a3b8; margin-bottom: 2rem;">Proportional budget split across catering (Swiggy/Zomato), venue (OYO), and decorations.</p>

  <div class="panel">
    <form id="partyForm">
      <label>Party Budget (₹ INR):</label>
      <input type="number" id="budget" class="input-field" value="30000" required>

      <label>Guest Count:</label>
      <input type="number" id="guestCount" class="input-field" value="25" required>

      <label>Occasion / Event Type:</label>
      <select id="eventType">
        <option value="Birthday Celebration">Birthday Celebration</option>
        <option value="Wedding Reception">Wedding Reception</option>
        <option value="House Party">House Party</option>
        <option value="Corporate Mixer">Corporate Mixer</option>
      </select>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Calculate Party Allocation</button>
    </form>
  </div>

  <div id="results" style="margin-top: 2rem; display: none;" class="panel">
    <h2 style="color: #f7b731; margin-bottom: 1rem;">Party Allocations</h2>
    <div id="outputContent"></div>
  </div>
</div>

<script>
  document.getElementById('partyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.innerText = 'Calculating with Gemini 1.5 Flash...';
    btn.disabled = true;

    const payload = {
      budget: parseFloat(document.getElementById('budget').value),
      currency: 'INR',
      guestCount: parseInt(document.getElementById('guestCount').value),
      eventType: document.getElementById('eventType').value
    };

    try {
      const res = await fetch('/generate-party', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      document.getElementById('results').style.display = 'block';
      let html = `<p><strong>Total Estimated:</strong> ₹${data.totalEstimatedCost} (₹${data.costPerGuest} / guest)</p><br>`;
      data.allocations.forEach(a => {
        html += `<h3 style="color: #f7b731; margin-top: 1rem;">${a.category} (₹${a.allocatedAmount})</h3>`;
        a.vendorSuggestions.forEach(it => {
          html += `<div style="background: rgba(0,0,0,0.3); padding: 0.75rem; border-radius: 8px; margin: 0.5rem 0;">
                    <strong>${it.name}</strong> (${it.platform}) - ₹${it.price}<br>
                    <small style="color: #94a3b8;">${it.description}</small>
                   </div>`;
        });
      });
      document.getElementById('outputContent').innerHTML = html;
    } catch(err) {
      alert('Error communicating with backend');
    } finally {
      btn.innerText = 'Calculate Party Allocation';
      btn.disabled = false;
    }
  });
</script>
{% endblock %}
